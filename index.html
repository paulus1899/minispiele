<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Minispiele</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121318;--card:#1b1d25;--card2:#242733;--line:#30343f;--tx:#eceef3;--mut:#9095a5;--p0:#ff4d5e;--p1:#3fa9ff;--acc:#ffd23f;--ok:#3ddc84;--ink0:#d0313d;--ink1:#1f4fbf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif}
body{min-height:100vh}
button{font:inherit;cursor:pointer;border:none;color:inherit}
button:disabled{cursor:default}
input{font:inherit}
.hand{font-family:Caveat,cursive}
.mut{color:var(--mut)} .sm{font-size:.85em}
.btn{background:var(--card2);color:var(--tx);padding:11px 18px;border-radius:12px;font-weight:600;border:1px solid var(--line);transition:transform .08s,filter .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn.pri{background:var(--acc);color:#1b1b1b;border-color:transparent}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4}
.btn.danger{background:#3a1c22;border-color:#6b2a35;color:#ffb3bc}
.ghead{justify-content:space-between}
.notebar{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.92rem}
.err{color:#ff7b86;min-height:1.2em;font-size:.9rem}
.paper .err{color:var(--ink0);font-size:1.15rem}
/* Home */
.home{max-width:420px;margin:0 auto;padding:48px 20px;display:flex;flex-direction:column;gap:14px}
.logo{font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
.home label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem;color:var(--mut)}
.home input,.joinrow input{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:13px 14px;border-radius:12px;font-size:1.05rem;outline:none}
.home input:focus{border-color:var(--acc)}
.btn.big{padding:15px;font-size:1.05rem}
.or{text-align:center;color:var(--mut);font-size:.85rem}
.joinrow{display:flex;gap:10px}
.joinrow input{flex:1;text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:800;min-width:0}
.prev{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.prev span{background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:20px;font-size:.8rem;color:var(--mut)}
/* Shell */
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{font-weight:800;font-size:1.1rem}
.room{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:.8rem;color:var(--mut);cursor:pointer}
.room b{color:var(--tx);letter-spacing:.15em}
.sc{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:.95rem}
.pl{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;border:2px solid transparent;max-width:150px}
.pl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl b{font-size:1.1rem}
.pl.p0 .dot{background:var(--p0)} .pl.p1 .dot{background:var(--p1)}
.pl.on.p0{border-color:var(--p0)} .pl.on.p1{border-color:var(--p1)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
#banner:not(:empty){background:#5a2a10;color:#ffd7b0;padding:8px 14px;font-size:.9rem;text-align:center}
main{max-width:980px;margin:0 auto;padding:16px 12px 60px}
/* Lobby */
.wait{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-bottom:20px}
.bigcode{font-size:2.6rem;font-weight:800;letter-spacing:.3em;color:var(--acc);padding-left:.3em}
.pulse{font-size:1.8rem;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}
.sect{font-size:1rem;color:var(--mut);font-weight:600;margin:6px 4px 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .1s,border-color .15s}
.tile:hover:not(:disabled){border-color:var(--acc);transform:translateY(-2px)}
.tile:disabled{opacity:.45}
.ti{font-size:1.9rem}
.tn{font-weight:700}
.td{font-size:.8rem;color:var(--mut)}
.note{color:var(--mut);font-size:.85rem;margin-top:18px;text-align:center}
.players{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
/* Game view */
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.gtitle{font-weight:800;font-size:1.15rem}
.status{min-height:28px;text-align:center;margin:6px 0 12px;font-size:1rem}
.yourturn{color:var(--acc);font-weight:700}
.board{display:flex;flex-direction:column;align-items:center}
.result{margin:18px auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;text-align:center;max-width:420px}
.rt{font-size:1.35rem;font-weight:800;margin-bottom:12px}
.rbtns{display:flex;gap:10px;justify-content:center}
.rules{max-width:560px;margin:24px auto 0;color:var(--mut);font-size:.9rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rules summary{cursor:pointer;font-weight:600;color:var(--tx)}
.rules div{margin-top:8px;line-height:1.5}
.mk-s{font-size:1.6rem;font-weight:700;line-height:1;vertical-align:middle}
/* Paper */
.paper{background-color:#fbfaf3;background-image:linear-gradient(#d3e1f1 1px,transparent 1px),linear-gradient(90deg,#d3e1f1 1px,transparent 1px);background-size:22px 22px;color:#24399a;border-radius:4px;box-shadow:0 12px 30px rgba(0,0,0,.45);font-family:Caveat,cursive;position:relative}
.paper.margin{background-image:linear-gradient(90deg,transparent 44px,#ef9aa1 44px,#ef9aa1 46px,transparent 46px),linear-gradient(#d3e1f1 1px,transparent 1px),linear-gradient(90deg,#d3e1f1 1px,transparent 1px);background-size:100% 100%,22px 22px,22px 22px}
.paper .mut,.paper .mut2{color:#6b7591}
.mut2{font-size:1.1rem}
.good{color:#1d8a4a;font-weight:700} .bad{color:var(--ink0)}
/* TTT */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);width:min(86vw,340px);aspect-ratio:1;padding:18px}
.ttt .cell{background:transparent;border:0;padding:0;display:flex;align-items:center;justify-content:center}
.ttt .cell:nth-child(3n+1),.ttt .cell:nth-child(3n+2){border-right:3px solid #2c3d7c}
.ttt .cell:nth-child(-n+6){border-bottom:3px solid #2c3d7c}
.ttt .mk{font-size:min(22vw,92px);font-weight:700;line-height:1}
.cell.win,.sb.win{background:rgba(255,210,63,.45)}
.ttt .cell:not(:disabled):hover{background:rgba(255,210,63,.18)}
/* UTTT */
.uttt{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px;width:min(94vw,450px);aspect-ratio:1}
.sb{position:relative;display:grid;grid-template-columns:repeat(3,1fr);border:2px solid rgba(44,61,124,.35);border-radius:5px}
.sb.act{background:rgba(255,210,63,.3);border-color:#d49b00}
.sb .cell{border:1px solid #a9bbdb;background:transparent;font-family:Caveat;font-size:clamp(17px,5.5vw,28px);font-weight:700;padding:0;line-height:1}
.sb .cell:not(:disabled):hover{background:rgba(255,210,63,.35)}
.sb.done .cell{opacity:.22}
.sb .cell.last{background:rgba(63,169,255,.18)}
.bigmark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(60px,22vw,120px);font-weight:700;pointer-events:none;line-height:1}
/* Connect 4 */
.c4{display:grid;grid-template-columns:repeat(7,1fr);width:min(94vw,470px);background:#1e4fd6;padding:10px;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 -6px 0 rgba(0,0,0,.25)}
.c4 .slot{aspect-ratio:1;padding:9%;background:transparent;border:0}
.c4.mine .slot.col-ok{cursor:pointer}
.c4.mine .slot.hl .pc:not(.p0):not(.p1){background:#2a3a70}
.c4 .pc{width:100%;height:100%;border-radius:50%;background:#0f1630;box-shadow:inset 0 4px 7px rgba(0,0,0,.6)}
.c4 .pc.p0{background:radial-gradient(circle at 35% 30%,#ff7a85,#e3283a 60%,#b51525);box-shadow:inset 0 -3px 5px rgba(0,0,0,.3)}
.c4 .pc.p1{background:radial-gradient(circle at 35% 30%,#fff09a,#ffd21f 60%,#d8a800);box-shadow:inset 0 -3px 5px rgba(0,0,0,.25)}
.c4 .pc.drop{animation:drop .35s cubic-bezier(.4,0,.8,1.2)}
@keyframes drop{from{transform:translateY(calc((var(--r) + 1) * -115%))}to{transform:none}}
.pc.win,.st.win{outline:4px solid #fff;outline-offset:-2px;animation:pulse 1s infinite}
/* Gomoku */
.go{display:grid;grid-template-columns:repeat(15,1fr);width:min(96vw,580px);aspect-ratio:1;background:linear-gradient(135deg,#e2b971,#d4a55a);padding:2.5%;border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.pt{position:relative;background:transparent;padding:0;border:0}
.pt::before{content:'';position:absolute;left:0;right:0;top:50%;height:1px;background:#6b4a1a}
.pt::after{content:'';position:absolute;top:0;bottom:0;left:50%;width:1px;background:#6b4a1a}
.pt:nth-child(15n+1)::before{left:50%} .pt:nth-child(15n)::before{right:50%}
.pt:nth-child(-n+15)::after{top:50%} .pt:nth-child(n+211)::after{bottom:50%}
.go.mine .pt:not(:disabled):hover .ghost{display:block}
.st,.ghost{position:absolute;inset:7%;border-radius:50%;z-index:1}
.ghost{display:none;opacity:.4}
.st.s0,.ghost.s0{background:radial-gradient(circle at 35% 30%,#666,#111 60%)}
.st.s1,.ghost.s1{background:radial-gradient(circle at 35% 30%,#fff,#d8d8d8 70%)}
.st.last::after{content:'';position:absolute;inset:36%;border-radius:50%;background:#e63946}
.stone-s{width:18px;height:18px;border-radius:50%;display:inline-block;vertical-align:middle}
/* SLF */
.sheet{width:min(96vw,560px);padding:18px 18px 22px 58px}
.shead{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.letter{font-size:64px;font-weight:700;color:var(--ink0);width:92px;height:92px;flex:none;display:flex;align-items:center;justify-content:center;border:3px solid var(--ink0);border-radius:52% 46% 55% 44%/48% 55% 45% 52%;transform:rotate(-4deg);line-height:1}
.sinfo{font-size:1.35rem;line-height:1.2}
.sinfo .tot,.sinfo .lastr{font-size:1.15rem;color:#56607d}
.timer{font-size:1.6rem;font-weight:700;color:#24399a}
.timer.low{color:var(--ink0);animation:pulse 1s infinite}
.srow{display:flex;align-items:flex-end;gap:12px;min-height:46px}
.scat{color:var(--ink0);font-size:1.45rem;font-weight:700;width:118px;flex:none;text-align:left;line-height:1.05;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.sin{flex:1;min-width:0;background:transparent;border:0;border-bottom:2px dashed #8ea5d1;font-family:Caveat,cursive;font-size:1.75rem;color:#1f3593;padding:2px 4px;outline:none;border-radius:0}
.sin:focus{border-bottom-color:#24399a;border-bottom-style:solid}
.sin:disabled{color:#5a6a9a}
.sin::placeholder{color:#b8c4dd}
.sfoot{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:18px;font-size:1.2rem;text-align:center}
.btn.stop{background:var(--ink0);color:#fff;font-family:Caveat,cursive;font-size:1.9rem;padding:6px 34px;border-radius:14px;transform:rotate(-2deg);border:0}
.rev{width:100%;border-collapse:collapse;font-size:1.3rem}
.rev th,.rev td{padding:4px 4px;text-align:left;vertical-align:middle}
.rev tr:not(.sum){border-bottom:1px dashed #b5c5e2}
.rev th.scat{width:auto;font-size:1.3rem}
.ans{background:transparent;border:0;font-family:Caveat,cursive;font-size:1.45rem;color:#1f3593;text-align:left;padding:2px 4px;display:flex;flex-direction:column;width:100%;border-radius:6px}
.ans:not(:disabled):hover{background:rgba(255,210,63,.3)}
.ans.bad .aw{text-decoration:line-through;text-decoration-color:var(--ink0);text-decoration-thickness:2px;color:#8a93b0}
.ans.empty{color:#aab4cc}
.votes{font-size:1.05rem;letter-spacing:2px} .votes i{font-style:normal;font-weight:700}
.pt-s{font-size:1.05rem;color:#1d8a4a}
.rev .sum td,.rev .sum th{font-weight:700;font-size:1.4rem;padding-top:8px}
/* Battleship */
.bswrap{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-start}
.bsp{padding:12px 14px 16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.bsp h4{margin:0;font-size:1.5rem}
.bsg{display:grid;grid-template-columns:repeat(11,1fr);width:min(88vw,400px)}
.bsg.small{width:min(70vw,290px)}
.bc{aspect-ratio:1;border:1px solid #b5c7e4;background:transparent;padding:0;font-family:Caveat,cursive;font-weight:700;font-size:clamp(15px,4.6vw,26px);line-height:1;color:#1f4fbf}
.lb{display:flex;align-items:center;justify-content:center;color:#7a8bb0;font-size:clamp(12px,3.5vw,18px)}
.bc.ship{background:rgba(31,79,191,.25);border-color:#3657b8}
.bc.hit{color:var(--ink0)}
.bc.sunk{background:rgba(208,49,61,.2)}
.bc.water{color:#9aa9c6}
.bsg.click .bc.free:hover{background:rgba(255,210,63,.35);cursor:pointer}
.bc.lastshot{outline:3px solid #f0b400;outline-offset:-2px}
.bsctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bsctl .btn{font-family:Inter,sans-serif}
.fleetlist{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:1.25rem}
.fleetlist span.done{text-decoration:line-through;color:#9aa6c2}
.bsp .btn.pri{font-family:Inter,sans-serif}
/* Mastermind */
.mmwrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start}
.mmbox{background:linear-gradient(160deg,#a8743f,#8d5b2d);border-radius:14px;padding:14px;box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2);display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff3e2;min-width:280px}
.mmbox h4{margin:0 0 4px;font-size:1rem}
.mmbox p{margin:4px 0;text-align:center}
.mmbox .mut{color:#f2dcc0}
.mmbox.opp{opacity:.95}
.mmrow{display:flex;align-items:center;gap:8px;padding:4px 8px;background:rgba(0,0,0,.12);border-radius:10px}
.mmrow.cur{background:rgba(255,255,255,.12)}
.mmn{width:18px;font-size:.8rem;color:#f2dcc0;text-align:right}
.peg{width:30px;height:30px;border-radius:50%;display:inline-block;box-shadow:inset -3px -4px 6px rgba(0,0,0,.35),0 2px 3px rgba(0,0,0,.4)}
.peg.e{background:#5a3818;box-shadow:inset 0 3px 5px rgba(0,0,0,.6)}
.slot{background:none;padding:0;border:0}
.fb{display:grid;grid-template-columns:repeat(2,11px);gap:3px;margin-left:6px}
.fb i{width:11px;height:11px;border-radius:50%;background:#5a3818;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.fb i.b{background:#111;box-shadow:0 0 0 1px #000}
.fb i.w{background:#fff}
.pal{display:flex;gap:8px;margin:4px 0}
.pal .pc{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.6);box-shadow:0 3px 6px rgba(0,0,0,.4)}
.mmbox .good{color:#c9ffd9} .mmbox .bad{color:#ffd0d0}
.mmhint{font-size:.8rem;color:#f2dcc0;max-width:300px;text-align:center}
/* Zahlenraten */
.zr{width:min(96vw,640px);padding:16px 20px 22px;font-size:1.35rem}
.zr h4{margin:4px 0;font-size:1.5rem}
.zr .big{font-size:1.8rem;margin:6px 0}
.zrcols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:560px){.zrcols{grid-template-columns:1fr}}
.zrin{display:flex;gap:10px;align-items:center;margin-top:8px}
.zrin input{width:120px;background:transparent;border:0;border-bottom:2px dashed #8ea5d1;font-family:Caveat,cursive;font-size:2rem;color:#1f3593;outline:none;text-align:center;border-radius:0}
.zrin .btn{font-family:Inter,sans-serif;font-size:1rem}
.zrlist{list-style:none;padding:0;margin:6px 0;display:flex;flex-direction:column;gap:2px}
.zrlist .n{display:inline-block;min-width:54px;font-weight:700}
.up{color:#1d8a4a} .dn{color:var(--ink0)} .ok{color:#1d8a4a;font-weight:700}
.rng{font-size:1.4rem}
.zr .opp{border-left:2px dashed #b5c5e2;padding-left:16px}
@media(max-width:560px){.zr .opp{border-left:0;padding-left:0;border-top:2px dashed #b5c5e2;padding-top:10px}}
/* Memory */
.mem{display:grid;gap:8px;width:min(96vw,600px)}
.mc{perspective:700px;background:none;padding:0;border:0;aspect-ratio:3/4}
.mc .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mc.up .in{transform:rotateY(180deg)}
.mc .bk,.mc .fr{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;display:flex;align-items:center;justify-content:center}
.mc .bk{background:repeating-linear-gradient(45deg,#3a3f9a 0 7px,#4a51b8 7px 14px);border:2px solid rgba(255,255,255,.25);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.mc .fr{background:#f7f3e8;transform:rotateY(180deg);font-size:clamp(18px,6.5vw,42px);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.mc.tk .in{opacity:.6}
.mc.tk0 .fr{box-shadow:inset 0 0 0 4px var(--p0)}
.mc.tk1 .fr{box-shadow:inset 0 0 0 4px var(--p1)}
.mc.nomatch .fr{box-shadow:inset 0 0 0 4px #888}
.mc:not(.up):hover .bk{filter:brightness(1.2)}
/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;width:min(100%,460px);max-height:90vh;overflow:auto}
.mbox h3{margin:0 0 14px}
.mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.opt{margin-bottom:16px}
.opt>div:first-child{font-weight:600;font-size:.9rem;color:var(--mut);margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:.9rem}
.seg button.on{background:var(--acc);color:#1b1b1b;border-color:transparent;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 12px;display:flex;align-items:center;gap:6px;font-size:.9rem}
.chip button{background:transparent;color:var(--mut);padding:0 6px;font-size:1rem}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--tx);padding:9px 12px;border-radius:10px;outline:none}
.linkbtn{background:none;color:var(--mut);text-decoration:underline;font-size:.8rem;padding:4px 0;margin-top:6px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* =========================================================
   Hilfsfunktionen
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = (n = 8) => { let s = ''; while (s.length < n) s += Math.random().toString(36).slice(2); return s.slice(0, n); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let fbP = null;
function loadFirebase() {
  if (fbP) return fbP;
  fbP = (async () => {

    const [appM, authM, dbM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-database.js')]);
    const app = appM.initializeApp(FB_CONFIG);

    return { db: dbM.getDatabase(app), d: dbM, uid: auth.currentUser.uid };
  })();
  fbP.catch(() => { fbP = null; });

async function cleanupOldRooms(fb) {
  const { db, d } = fb;
  const q = d.query(d.ref(db, 'rooms'), d.orderByChild('meta/t'), d.endAt(Date.now() - ROOM_MAX_AGE), d.limitToFirst(20));
  const snap = await d.get(q);
  snap.forEach(ch => { d.remove(ch.ref).catch(() => {}); });
}
async function makeFirebaseTransport(code, asHost) {
  const fb = await withTimeout(loadFirebase(), 12000);
  const { db, d, uid } = fb;
  const R = d.ref(db, 'rooms/' + code), unsubs = [];
  let online = true;
  const meta = await withTimeout(d.get(d.child(R, 'meta')), 10000);
  if (asHost) {
    if (meta.exists() && meta.val().host !== uid) throw new Error('taken');
    await d.set(d.child(R, 'meta'), { host: uid, t: d.serverTimestamp() });
    cleanupOldRooms(fb).catch(() => {});
  } else if (!meta.exists()) throw new Error('notfound');
  unsubs.push(d.onValue(d.ref(db, '.info/connected'), s => { online = !!s.val(); }));
  return {
    kind: 'firebase', reliable: true,
    online: () => online,
    sendState(str) { d.set(d.child(R, 'state'), { d: str }).catch(() => {}); },
    onState(fn) { unsubs.push(d.onValue(d.child(R, 'state'), s => { const v = s.val(); fn(v && typeof v.d === 'string' ? v.d : null); })); },
    sendAct(o) { d.push(d.child(R, 'acts'), { d: JSON.stringify(o) }).catch(() => {}); },
    onAct(fn) {
      unsubs.push(d.onChildAdded(d.child(R, 'acts'), s => {
        const v = s.val(); d.remove(s.ref).catch(() => {});
        try { fn(JSON.parse(v.d)); } catch (e) {}
      }));
    },
    onPeers() {},
    heartbeat() { if (asHost) d.update(d.child(R, 'meta'), { t: d.serverTimestamp() }).catch(() => {}); },
    destroy() { return d.remove(R).catch(() => {}); },
    close() { unsubs.forEach(u => { try { u(); } catch (e) {} }); }
  };
}

// Claude-Räume und Testmodus können nur kleine Nachrichten schicken -> Zustand in Stücken senden
function chunked(raw) {
  const chunks = {};
  return {
    kind: raw.kind, reliable: false, online: () => true,
    sendState(str) { const k = rid(5), size = 1000, n = Math.max(1, Math.ceil(str.length / size)); for (let i = 0; i < n; i++) raw.send('st', { k, i, n, d: str.slice(i * size, (i + 1) * size) }); },
    onState(fn) {
      raw.on('st', m => {
        if (!m || typeof m.d !== 'string' || typeof m.k !== 'string') return;
        const now = Date.now();
        for (const k in chunks) if (now - chunks[k].t > 10000) delete chunks[k];
        const c = chunks[m.k] || (chunks[m.k] = { n: m.n, parts: [], got: 0, t: now });
        if (c.parts[m.i] == null) { c.parts[m.i] = m.d; c.got++; }
        if (c.got === c.n) { delete chunks[m.k]; fn(c.parts.join('')); }
      });
    },
    sendAct(o) { raw.send('ac', o); },
    onAct(fn) { raw.on('ac', fn); },
    onPeers: raw.onPeers, heartbeat() {}, destroy() {}, close: raw.close
  };
}
async function makeRoomRaw(api, code) {
  const r = await api.join('ms-' + code), unsubs = [];
  return {
    kind: 'room',
    send(topic, data) { r.emit(topic, data).catch(() => {}); },
    on(topic, fn) { unsubs.push(r.on(topic, m => fn(m.data))); },
    onPeers(fn) { unsubs.push(r.onPeers(ch => fn(ch))); },
    close() { unsubs.forEach(u => { try { u(); } catch (e) {} }); r.leave().catch(() => {}); }
  };
}
function makeLocalRaw(code) {
  const ch = new BroadcastChannel('minispiele-' + code), hs = {};
  ch.onmessage = e => { const d = e.data || {}; (hs[d.topic] || []).forEach(f => f(d.data)); };
  return {
    kind: 'local',
    send(t, d) { ch.postMessage({ topic: t, data: d }); },
    on(t, f) { (hs[t] = hs[t] || []).push(f); },
    onPeers() {},
    close() { ch.close(); }
  };
}

function sendState() { if (net && isHost && S) net.sendState(JSON.stringify(S)); }
function onStateStr(str) {
  if (isHost) return;
  if (str == null) { // Raum wurde gelöscht
    if (S) { leaveRoom(); homeMsg('Der Raum wurde vom Ersteller geschlossen.'); }
    return;
  }
  let st; try { st = JSON.parse(str); } catch (e) { return; }
  if (!st || !st.hs) return;
  lastStateAt = Date.now();
  if (S && S.hs === st.hs && st.v <= S.v) return;
  S = st; render();
}
function onActMsg(m) {
  if (!isHost || !m || !m.a || m.f === ME.id) return;
  handleAction(m.a, String(m.f));
}
function dispatch(a) {
  if (isHost) handleAction(a, ME.id);
  else if (net) net.sendAct({ f: ME.id, a });
}
function commit() {
  S.v++;
  sess.set('hostS', S);
  sendState();
  render();
}
const pidx = id => S ? S.players.findIndex(p => p.id === id) : -1;

/* ---------- Der Host verarbeitet alle Aktionen ---------- */
function handleAction(a, from) {
  if (!S || !a || typeof a.t !== 'string') return;
  const p = pidx(from);
  switch (a.t) {
    case 'hello': {
      const name = String(a.name || '').slice(0, 16) || 'Spieler';
      const pl = S.players.find(x => x.id === from);
      if (pl) { if (pl.name === name) { sendState(); return; } pl.name = name; }
      else if (S.players.length < 2) { S.players.push({ id: from, name }); S.scores[from] = 0; }
      else if (!S.spec.find(x => x.id === from)) S.spec.push({ id: from, name });
      else { sendState(); return; }
      commit(); return;
    }
    case 'pick':
      if (p < 0 || S.players.length < 2 || !GAMES[a.game]) return;
      S.note = null;
      startGame(a.game, a.opts || {}); commit(); return;
    case 'again':
      if (p < 0 || !S.game || !S.g.over) return;
      startGame(S.game, S.opts || {}); commit(); return;
    case 'menu':
      if (p < 0 || !S.game) return;
      S.note = S.g && !S.g.over ? { by: from, game: S.game, t: Date.now() } : null;
      S.game = null; S.g = null; commit(); return;
    default: {
      if (!S.game || p < 0 || S.g.over) return;
      if (GAMES[S.game].act(S.g, a, p) === false) return;
      afterMove(); commit();
    }
  }
}
function startGame(id, opts) {
  const first = S.next == null ? (Math.random() < .5 ? 0 : 1) : S.next;
  S.next = 1 - first;
  S.game = id; S.opts = opts;
  S.g = GAMES[id].init(opts, first);
  S.g.gid = rid(6); S.g.over = false;
}
function afterMove() {
  const g = S.g;
  if (g.over && !g.scored) {
    g.scored = true;
    if (!g.draw && g.winner != null && S.players[g.winner]) S.scores[S.players[g.winner].id]++;
  }
}

const CODE_CH = 'abcdefghjkmnpqrstuvwxyz23456789';
const newCode = () => Array.from({ length: 4 }, () => CODE_CH[Math.floor(Math.random() * CODE_CH.length)]).join('');

async function connect(code, asHost, restored, attempt = 0) {
  if (connecting && !attempt) return;
  connecting = true;
  homeMsg('Verbinde …');
  let t = null, err = null;
  const inClaude = !!(window.claude && window.claude.use);
  if (!inClaude) { try { t = await makeFirebaseTransport(code, asHost); } catch (e) { err = e; } }
  if (!t && err && err.message === 'taken' && asHost && attempt < 5) return connect(newCode(), true, null, attempt + 1);
  if (!t && err && err.message === 'notfound') {
    connecting = false; sess.del('room');
    homeMsg('Kein Raum mit diesem Code gefunden. Stimmt der Code?');
    render(); return;
  }
  if (!t) { const api = await roomApiP; if (api) { try { t = chunked(await makeRoomRaw(api, code)); } catch (e) {} } }
  if (!t) { try { t = chunked(makeLocalRaw(code)); } catch (e) {} }
  connecting = false;
  if (!t) { homeMsg('Verbindung nicht möglich. Bist du online?'); return; }
  net = t; isHost = asHost; joinAt = Date.now(); lastStateAt = Date.now(); lastBeat = Date.now();
  t.onState(onStateStr);
  t.onAct(onActMsg);
  t.onPeers(() => { if (isHost) sendState(); });
  sess.set('room', { code, host: asHost });
  homeMsg('');
  try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  if (asHost) {
    S = (restored && restored.code === code) ? restored : {
      hs: rid(6), v: 1, code, host: ME.id,
      players: [{ id: ME.id, name: ME.name || 'Spieler 1' }], spec: [],
      scores: { [ME.id]: 0 }, game: null, g: null, opts: null, next: null, note: null
    };
    commit();
  } else { S = null; lastHello = 0; render(); }
}
function leaveRoom() {
  if (net) { if (isHost) net.destroy(); net.close(); }
  net = null; S = null; isHost = false;
  sess.del('room'); sess.del('hostS');
  render();
}
const inRoom = () => S && (S.players.some(p => p.id === ME.id) || S.spec.some(p => p.id === ME.id));

const GAMES = {};

const LINES3 = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const win3 = (arr, v) => LINES3.find(l => l.every(i => arr[i] === v)) || null;
function lineWin(get, W, H, n, x, y) {
  const p = get(x, y); if (!p) return null;
  for (const [dx, dy] of [[1,0],[0,1],[1,1],[1,-1]]) {
    const cells = [[x, y]];
    for (const s of [1, -1]) for (let i = 1; ; i++) {
      const nx = x + dx * i * s, ny = y + dy * i * s;
      if (nx < 0 || ny < 0 || nx >= W || ny >= H || get(nx, ny) !== p) break;
      cells.push([nx, ny]);
    }
    if (cells.length >= n) return cells;
  }
  return null;
}
const XO = (g, p) => p === g.first ? 'X' : 'O';
const xoPiece = (g, p) => `<span class="hand mk-s" style="color:${INK[p]}">${XO(g, p)}</span>`;

/* ---------- Tic-Tac-Toe ---------- */
GAMES.ttt = {
  name: 'Tic-Tac-Toe', icon: '❌', desc: 'Drei in einer Reihe', turn: true, piece: xoPiece,
  rules: 'Ihr setzt abwechselnd X und O. Wer zuerst drei eigene Zeichen in einer Reihe hat – waagerecht, senkrecht oder diagonal – gewinnt. Wer anfängt, spielt X.',
  init: (o, first) => ({ b: Array(9).fill(0), turn: first, first }),
  act(g, a, p) {
    if (a.t !== 'm' || p !== g.turn) return false;
    const i = a.i | 0; if (i < 0 || i > 8 || g.b[i]) return false;
    g.b[i] = p + 1;
    const w = win3(g.b, p + 1);
    if (w) { g.over = true; g.winner = p; g.line = w; }
    else if (g.b.every(Boolean)) { g.over = true; g.draw = true; }
    else g.turn = 1 - p;
  },
  render(el, c) {
    const g = c.g, my = !g.over && g.turn === c.me;
    el.innerHTML = `<div class="paper ttt">${g.b.map((v, i) =>
      `<button class="cell ${g.line && g.line.includes(i) ? 'win' : ''}" data-i="${i}" ${v || !my ? 'disabled' : ''}>${v ? `<span class="mk" style="color:${INK[v - 1]}">${XO(g, v - 1)}</span>` : ''}</button>`).join('')}</div>`;
    el.onclick = e => { const b = e.target.closest('.cell'); if (b && !b.disabled) c.dispatch({ t: 'm', i: +b.dataset.i }); };
  }
};

/* ---------- Ultimate Tic-Tac-Toe ---------- */
GAMES.uttt = {
  name: 'Ultimate Tic-Tac-Toe', icon: '#️⃣', desc: '9 Felder in 9 Feldern', turn: true, piece: xoPiece,
  rules: 'Das große Feld besteht aus 9 kleinen Tic-Tac-Toe-Feldern. Wer ein kleines Feld gewinnt, bekommt es. Wer drei kleine Felder in einer Reihe hat, gewinnt das Spiel.<br><b>Der Trick:</b> Die Position deines Zuges im kleinen Feld bestimmt, in welchem großen Feld dein Gegner als Nächstes spielen muss (gelb markiert). Ist dieses Feld schon entschieden oder voll, darf er frei wählen.',
  init: (o, first) => ({ b: Array(81).fill(0), sb: Array(9).fill(0), nb: -1, turn: first, first, last: -1 }),
  act(g, a, p) {
    if (a.t !== 'm' || p !== g.turn) return false;
    const i = a.i | 0; if (i < 0 || i > 80 || g.b[i]) return false;
    const B = (i / 9) | 0, k = i % 9;
    if (g.sb[B] || (g.nb >= 0 && g.nb !== B)) return false;
    g.b[i] = p + 1; g.last = i;
    const sub = g.b.slice(B * 9, B * 9 + 9);
    if (win3(sub, p + 1)) g.sb[B] = p + 1; else if (sub.every(Boolean)) g.sb[B] = 3;
    const w = win3(g.sb, p + 1);
    if (w) { g.over = true; g.winner = p; g.line = w; return; }
    if (g.sb.every(Boolean)) { g.over = true; g.draw = true; return; }
    g.nb = g.sb[k] ? -1 : k;
    g.turn = 1 - p;
  },
  render(el, c) {
    const g = c.g, my = !g.over && g.turn === c.me;
    let h = '<div class="paper uttt">';
    for (let B = 0; B < 9; B++) {
      const act = !g.over && !g.sb[B] && (g.nb < 0 || g.nb === B);
      h += `<div class="sb ${act ? 'act' : ''} ${g.sb[B] ? 'done' : ''} ${g.line && g.line.includes(B) ? 'win' : ''}">`;
      for (let k = 0; k < 9; k++) {
        const i = B * 9 + k, v = g.b[i];
        h += `<button class="cell ${g.last === i ? 'last' : ''}" data-i="${i}" ${!my || !act || v ? 'disabled' : ''}>${v ? `<span style="color:${INK[v - 1]}">${XO(g, v - 1)}</span>` : ''}</button>`;
      }
      if (g.sb[B]) h += `<div class="bigmark" style="color:${g.sb[B] === 3 ? '#8a93b0' : INK[g.sb[B] - 1]}">${g.sb[B] === 3 ? '–' : XO(g, g.sb[B] - 1)}</div>`;
      h += '</div>';
    }
    el.innerHTML = h + '</div>';
    el.onclick = e => { const b = e.target.closest('.cell'); if (b && !b.disabled) c.dispatch({ t: 'm', i: +b.dataset.i }); };
  }
};

          if (canPlace(bsL.ships, s)) { bsL.ships.push(s); bsL.msg = ''; }
          else bsL.msg = 'Passt da nicht – Schiffe dürfen nicht über den Rand ragen oder sich berühren.';
          c.rerender();
        }
      };
      return;
    }
    // Schießphase
    const myTurn = !g.over && g.turn === c.me;
    const shMine = g.shots[me], shOpp = g.shots[opp];
    const em = fleetMap(g.fleets[opp]), es = sunkShips(g.fleets[opp], shMine);
    const om = fleetMap(g.fleets[me]), os = sunkShips(g.fleets[me], shOpp);
    const lastE = g.last && g.last.p === me ? g.last.i : -1, lastO = g.last && g.last.p === opp ? g.last.i : -1;
    const enemyCell = i => {
      const s = shMine[i], k = em[i], L = i === lastE ? ' lastshot' : '';
      if (s === '1' && k >= 0) return ['hit' + (es[k] ? ' sunk' : '') + L, '✕'];
      if (s === '1') return ['miss' + L, '•'];
      if (s === '2') return ['water', '·'];
      if (g.over && k >= 0) return ['ship', ''];
      return ['free', ''];
    };
    const ownCell = i => {
      const s = shOpp[i], k = om[i], L = i === lastO ? ' lastshot' : '';
      let cls = k >= 0 ? 'ship' : '';
      if (s === '1' && k >= 0) return [cls + ' hit' + (os[k] ? ' sunk' : '') + L, '✕'];
      if (s === '1') return ['miss' + L, '•'];
      if (s === '2') return ['water', '·'];
      return [cls, ''];
    };
    const sunkList = (ships, flags) => ships.map((s, k) => `<span class="${flags[k] ? 'done' : ''}">${SHIPNAME[s[2]]} (${s[2]})</span>`).join('');
    el.innerHTML = `<div class="bswrap">
      <div class="paper bsp"><h4>${c.me < 0 ? esc(c.names[opp]) + 's Meer' : 'Gegnerisches Meer'}</h4>${bsGrid('enemy', enemyCell, myTurn ? 'click' : '')}
        <div class="fleetlist">${sunkList(g.fleets[opp], es)}</div></div>
      <div class="paper bsp"><h4>${c.me < 0 ? esc(c.names[me]) + 's Flotte' : 'Deine Flotte'}</h4>${bsGrid('own', ownCell, 'small')}</div></div>`;
    el.onclick = e => { const t = e.target.closest('#enemy .bc.free'); if (t && myTurn) c.dispatch({ t: 'shot', i: +t.dataset.i }); };
  }
};

/* ---------- Code knacken (Mastermind) ---------- */
const MMC = ['#e3283a', '#2f8cff', '#2fcf6f', '#ffd21f', '#ff8a1a', '#a855f7'];
let mmL = { key: null, cur: [null, null, null, null] };
const mmFin = (g, p) => g.solved[p] > 0 || g.guesses[p].length >= g.max;
function mmFeedback(code, guess) {
  let b = 0; const cc = Array(6).fill(0), gc = Array(6).fill(0);
  for (let i = 0; i < 4; i++) { if (code[i] === guess[i]) b++; cc[code[i]]++; gc[guess[i]]++; }
  let t = 0; for (let k = 0; k < 6; k++) t += Math.min(cc[k], gc[k]);
  return { b, w: t - b };
}
const validCode = c => Array.isArray(c) && c.length === 4 && c.every(x => Number.isInteger(x) && x >= 0 && x < 6);

  name: 'Code knacken', icon: '🎨', desc: 'Mastermind – Farbcode erraten',

      if (g.codes[0] && g.codes[1]) g.phase = 'play';
      return;
    }
    if (a.t === 'guess') {
      if (g.phase !== 'play' || mmFin(g, p) || !validCode(a.code)) return false;
      const f = mmFeedback(g.codes[1 - p], a.code);
      g.guesses[p].push({ c: a.code.slice(), b: f.b, w: f.w });
      if (f.b === 4) g.solved[p] = g.guesses[p].length;
      if (mmFin(g, 0) && mmFin(g, 1)) {
        g.over = true;

      el.innerHTML = `<div class="mmwrap">${el.innerHTML}</div>`; el.onclick = null; return;
    }
    const key = g.gid + g.phase + g.guesses[me].length;

    const builder = label => `<div class="mmrow cur">${mmL.cur.map((x, k) => `<button class="slot" data-k="${k}">${peg(x)}</button>`).join('')}</div>

      <button class="btn pri" id="mmgo" ${mmL.cur.includes(null) ? 'disabled' : ''}>${label}</button>

        : `<div class="mmbox"><p><b>Lege deinen Geheimcode fest</b><br><span class="mut">${nm} muss ihn knacken. Farben dürfen doppelt vorkommen.</span></p>${builder('Code festlegen')}</div>`;

    }
    el.innerHTML = h;
    el.onclick = e => {

  renderHeader();
  const main = $('#main');
  if (!S.game) {
    if (main.dataset.view !== 'lobby') { main.dataset.view = 'lobby'; }
    renderLobby(main);
  } else {
    const k = 'game:' + S.g.gid;
    if (main.dataset.view !== k) { main.dataset.view = k; main.innerHTML = ''; }
    renderGame(main);
  }
}
function copyCode() {
  if (!S) return;
  try { navigator.clipboard.writeText(S.code.toUpperCase()).then(() => flash('Code kopiert!'), () => {}); } catch (e) {}
}
function flash(t) { const b = $('#banner'); if (!b) return; b.dataset.flash = '1'; b.style.background = '#1f4d2e'; b.style.color = '#c9ffd9'; b.textContent = t; setTimeout(() => { b.textContent = ''; b.style.background = ''; b.style.color = ''; delete b.dataset.flash; }, 1800); }
function confirmBox(title, text, okLabel, fn) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="mbox" style="max-width:380px"><h3>${esc(title)}</h3><p class="mut" style="line-height:1.5;margin:0">${esc(text)}</p><div class="mbtns"><button class="btn" data-x>Abbrechen</button><button class="btn danger" data-ok>${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(m);
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-ok]', m).onclick = () => { m.remove(); fn(); };
  m.onclick = e => { if (e.target === m) m.remove(); };
}
function inviteLink() { return location.origin + location.pathname + '#' + S.code.toUpperCase(); }
function shareInvite() {
  if (!S) return;
  const url = inviteLink(), text = `Spiel mit mir Minispiele! Raum-Code: ${S.code.toUpperCase()}`;
  if (navigator.share) { navigator.share({ title: 'Minispiele', text, url }).catch(() => {}); return; }
  try { navigator.clipboard.writeText(url).then(() => flash('Einladungslink kopiert!'), () => {}); } catch (e) {}
}
function renderHome(app) {
  if (app.dataset.view === 'home') return;
  app.dataset.view = 'home';
  app.innerHTML = `<div class="home">
    <div class="logo">🎲 Minispiele</div>
    <div class="mut">Klassische Spiele für zwei – jeder auf seinem eigenen Gerät.</div>
    <label>Dein Name<input id="nm" maxlength="16" placeholder="z. B. Paul" value="${esc(ME.name)}"></label>
    <button class="btn pri big" id="create">Raum erstellen</button>
    <div class="or">— oder —</div>
    <div class="joinrow"><input id="code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button class="btn" id="join">Beitreten</button></div>
    <div id="hmsg" class="err">${esc(homeMsgText)}</div>
    <div class="prev">${ORDER.map(id => `<span>${GAMES[id].icon} ${GAMES[id].name}</span>`).join('')}</div></div>`;
  const nm = $('#nm');
  const saveName = () => { ME.name = nm.value.trim().slice(0, 16); store.set('name', ME.name); return ME.name; };
  nm.oninput = saveName;
  $('#create').onclick = () => { if (!saveName()) { homeMsg('Bitte gib zuerst deinen Namen ein.'); nm.focus(); return; } connect(newCode(), true); };
  const join = () => {
    if (!saveName()) { homeMsg('Bitte gib zuerst deinen Namen ein.'); nm.focus(); return; }
    const code = $('#code').value.trim().toLowerCase();
    if (!/^[a-z0-9]{4}$/.test(code)) { homeMsg('Der Code hat 4 Zeichen.'); return; }
    connect(code, false);
  };
  $('#join').onclick = join;
  $('#code').onkeydown = e => { if (e.key === 'Enter') join(); };
}
function renderWaiting(app) {
  if (app.dataset.view === 'wait') return;
  app.dataset.view = 'wait';
  const code = (sess.get('room') || {}).code || '';
  app.innerHTML = `<div class="home"><div class="logo">🎲 Minispiele</div><div class="wait"><div class="pulse">📡</div><b>Verbinde mit Raum ${esc(code.toUpperCase())} …</b><div class="mut sm" id="wmsg"></div><button class="btn sm" id="cancel">Abbrechen</button></div></div>`;
  $('#cancel').onclick = leaveRoom;
}
function renderHeader() {
  const g = S.g, G = S.game && GAMES[S.game];
  const turnP = G && G.turn && g && !g.over ? g.turn : -1;
  $('#roomchip').innerHTML = `Raum <b>${S.code.toUpperCase()}</b> ⧉`;
  $('#score').innerHTML = S.players.map((p, i) => `<span class="pl p${i} ${turnP === i ? 'on' : ''}"><span class="dot"></span><span class="nm">${esc(p.name)}${p.id === ME.id ? ' (du)' : ''}</span><b>${S.scores[p.id] || 0}</b></span>`).join('<span class="mut">:</span>')
    + (S.spec.length ? `<span class="mut sm">👀 ${S.spec.length}</span>` : '');
}
function renderLobby(main) {
  const two = S.players.length >= 2, me = myIdx();
  main.innerHTML = `${!two ? `<div class="wait"><div class="pulse">⏳</div><div><b>Warte auf deinen Mitspieler …</b><br><span class="mut">Schick ihm diesen Raum-Code:</span></div><div class="bigcode">${S.code.toUpperCase()}</div><div class="rbtns">${net.kind === 'firebase' ? '<button class="btn sm pri" id="share">Einladungslink teilen</button>' : ''}<button class="btn sm" id="cp2">Code kopieren</button></div></div>` : ''}
    ${S.note && S.note.game && GAMES[S.note.game] ? `<div class="notebar">ℹ️ ${S.note.by === ME.id ? 'Du hast' : esc((S.players.find(p => p.id === S.note.by) || {}).name || 'Dein Mitspieler') + ' hat'} „${GAMES[S.note.game].name}“ beendet.</div>` : ''}
    ${me < 0 ? '<p class="note">Der Raum ist voll – du schaust zu.</p>' : ''}
    <h2 class="sect">${two ? 'Spiel auswählen' : 'Diese Spiele warten auf euch'}</h2>
    <div class="tiles">${ORDER.map(id => { const G = GAMES[id]; return `<button class="tile" data-g="${id}" ${!two || me < 0 ? 'disabled' : ''}><div class="ti">${G.icon}</div><div class="tn">${G.name}</div><div class="td">${G.desc}</div></button>`; }).join('')}</div>
    ${net.kind === 'local' ? '<p class="note">⚠️ Testmodus: Online-Räume sind hier nicht verfügbar. Verbindung klappt nur zwischen Tabs in diesem Browser.</p>' : ''}`;
  const cp = $('#cp2'); if (cp) cp.onclick = copyCode;
  const sh = $('#share'); if (sh) sh.onclick = shareInvite;
  main.querySelectorAll('.tile').forEach(t => t.onclick = () => openOpts(t.dataset.g));
}
function renderGame(main) {
  const G = GAMES[S.game], g = S.g, c = mkCtx();
  if (!main.firstChild) {
    main.innerHTML = `<div class="ghead"><div class="gtitle">${G.icon} ${G.name}</div><button class="btn sm danger" id="back"></button></div>
      <div class="status" id="status"></div><div class="board" id="board"></div><div id="resbar"></div>
      <details class="rules"><summary>Spielregeln</summary><div>${G.rules}</div></details>`;
  }
  const back = $('#back');
  back.style.display = c.me < 0 ? 'none' : '';
  if (g.over) { back.textContent = '← Zur Spielauswahl'; back.classList.remove('danger'); back.onclick = () => dispatch({ t: 'menu' }); }
  else {
    back.textContent = '✕ Spiel beenden'; back.classList.add('danger');
    back.onclick = () => confirmBox('Spiel beenden?', `Ihr kehrt beide zur Spielauswahl zurück. Das laufende Spiel „${G.name}“ wird nicht gewertet, der Punktestand bleibt erhalten.`, 'Spiel beenden', () => dispatch({ t: 'menu' }));
  }
  const ae = document.activeElement, fid = ae && ae.id && main.contains(ae) ? ae.id : null;
  let sel = null; try { sel = fid ? ae.selectionStart : null; } catch (e) {}
  $('#status').innerHTML = g.over ? '' : (G.status ? G.status(g, c) : G.turn ? turnText(g, c, G) : '');
  G.render($('#board'), c);
  const rb = $('#resbar');
  if (g.over) {
    const t = g.draw ? '🤝 Unentschieden!' : g.winner === c.me ? '🎉 Du hast gewonnen!' : `🏆 ${esc(c.names[g.winner])} gewinnt!`;
    rb.innerHTML = `<div class="result"><div class="rt">${t}</div>${c.me >= 0 ? '<div class="rbtns"><button class="btn pri" id="again">Nochmal</button><button class="btn" id="tomenu">Anderes Spiel</button></div>' : ''}</div>`;
    const a = $('#again'); if (a) a.onclick = () => dispatch({ t: 'again' });
    const m = $('#tomenu'); if (m) m.onclick = () => dispatch({ t: 'menu' });
  } else rb.innerHTML = '';
  if (fid) {
    const n = document.getElementById(fid);
    if (n && n !== document.activeElement && !n.disabled) { n.focus(); try { if (sel != null) n.setSelectionRange(sel, sel); } catch (e) {} }
  }
}
function openOpts(id) {
  const G = GAMES[id];
  if (!G.opts) { dispatch({ t: 'pick', game: id, opts: {} }); return; }
  const st = G.opts.load();
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="mbox"><h3>${G.icon} ${G.name}</h3><div class="mbody"></div><div class="mbtns"><button class="btn" data-x>Abbrechen</button><button class="btn pri" data-go>Los geht's!</button></div></div>`;
  document.body.appendChild(m);
  const body = $('.mbody', m), draw = () => G.opts.render(body, st, draw);
  draw();
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-go]', m).onclick = () => { G.opts.save(st); m.remove(); dispatch({ t: 'pick', game: id, opts: G.opts.out(st) }); };
  m.onclick = e => { if (e.target === m) m.remove(); };
}

/* =========================================================
   Taktgeber
   ========================================================= */
setInterval(() => {
  if (!net) return;
  const now = Date.now();
  if (isHost) {
    if (S && S.game && !S.g.over) { const G = GAMES[S.game]; if (G.hostTick && G.hostTick(S.g)) { afterMove(); commit(); } }
  } else {
    const helloGap = net.reliable ? 3000 : 1500;
    if (now - lastHello > helloGap && (!S || !inRoom() || (S.players.find(p => p.id === ME.id) || {}).name !== (ME.name || 'Spieler'))) {
      if (!S || !inRoom() || S.players.some(p => p.id === ME.id)) { lastHello = now; net.sendAct({ f: ME.id, a: { t: 'hello', name: ME.name || 'Spieler' } }); }
    }
    if (!S) { const w = $('#wmsg'); if (w && now - joinAt > 8000) w.textContent = 'Noch keine Antwort. Stimmt der Code? Ist der Raum-Ersteller online?'; }
  }
  const b = $('#banner');
  if (b && S && !b.dataset.flash) {
    let txt = '';
    if (!net.online()) txt = 'Keine Internetverbindung – warte …';
    else if (!isHost && !net.reliable && now - lastStateAt > 10000) txt = 'Verbindung zum Raum-Ersteller unterbrochen – warte …';
    if (b.textContent !== txt) b.textContent = txt;
  }
  if (S && S.game && S.g && GAMES[S.game].tick) GAMES[S.game].tick(S.g, mkCtx());
}, 300);
setInterval(() => {
  if (!isHost || !S || !net) return;
  if (!net.reliable) sendState();                                   // Claude-Räume: regelmäßig neu senden
  else if (Date.now() - lastBeat > 60000) { lastBeat = Date.now(); net.heartbeat(); } // Firebase: Raum als aktiv markieren
}, 3000);

/* Start: nach einem Neuladen automatisch zurück in den Raum */
(function boot() {
  const r = sess.get('room');
  if (r && r.code) connect(r.code, !!r.host, r.host ? sess.get('hostS') : null);
  else {
    render();
    const h = (location.hash || '').slice(1).toLowerCase();
    const ci = $('#code');
    if (ci && /^[a-z0-9]{4}$/.test(h)) { ci.value = h.toUpperCase(); homeMsg('Gib deinen Namen ein und tippe auf „Beitreten“.'); }
  }
})();
</script>
</body>
</html>
