<title>Minispiele</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121318;--card:#1b1d25;--card2:#242733;--line:#30343f;--tx:#eceef3;--mut:#9095a5;--p0:#ff4d5e;--p1:#3fa9ff;--acc:#ffd23f;--ok:#3ddc84;--ink0:#d0313d;--ink1:#1f4fbf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif}
body{min-height:100vh}
button{font:inherit;cursor:pointer;border:none;color:inherit}
button:disabled{cursor:default}
input{font:inherit}
.hand{font-family:Caveat,cursive}
.mut{color:var(--mut)} .sm{font-size:.85em}
.btn{background:var(--card2);color:var(--tx);padding:11px 18px;border-radius:12px;font-weight:600;border:1px solid var(--line);transition:transform .08s,filter .15s}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:hover:not(:disabled){filter:brightness(1.15)}
.btn.pri{background:var(--acc);color:#1b1b1b;border-color:transparent}
.btn.sm{padding:7px 12px;font-size:.85rem;border-radius:10px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4}
.hright{display:flex;align-items:center;gap:8px}
.turnbar{display:inline-flex;align-items:center;gap:10px;padding:10px 22px;border-radius:14px;background:var(--card2);border:1px solid var(--line);color:var(--mut);font-weight:700;font-size:1.05rem}
.turnbar.mine{background:var(--acc);color:#1b1b1b;border-color:transparent;font-size:1.2rem;letter-spacing:.02em;animation:turnpulse 1.4s ease-in-out infinite;box-shadow:0 0 0 0 rgba(255,210,63,.6)}
@keyframes turnpulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,210,63,.55)}50%{transform:scale(1.04);box-shadow:0 0 0 10px rgba(255,210,63,0)}}
.substatus{margin-top:8px;font-size:.95rem}
body.myturn::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:4;animation:edgeglow 1.6s ease-in-out infinite}
body.glow0::after{--gc:255,77,94} body.glow1::after{--gc:63,169,255}
@keyframes edgeglow{0%,100%{box-shadow:inset 0 0 18px 4px rgba(var(--gc),.55)}50%{box-shadow:inset 0 0 36px 10px rgba(var(--gc),.85)}}
.emobtn{position:fixed;right:16px;bottom:16px;width:54px;height:54px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:1.6rem;z-index:15;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.emopanel{position:fixed;right:16px;bottom:80px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;z-index:16;width:min(300px,calc(100vw - 32px));box-shadow:0 12px 30px rgba(0,0,0,.5)}
.emogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.emogrid button{background:var(--card2);border-radius:10px;font-size:1.6rem;padding:6px 0;font-weight:800}
.quick{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.quick button{background:var(--card2);border-radius:10px;padding:8px 10px;text-align:left;font-size:.9rem}
.emobubble{position:fixed;left:50%;top:84px;transform:translateX(-50%) scale(.6);z-index:22;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:8px 18px 10px;display:flex;flex-direction:column;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.5,.4,1) forwards;pointer-events:none}
.emobubble.p0{border-color:var(--p0)} .emobubble.p1{border-color:var(--p1)}
.emobubble .emwho{font-size:.8rem;color:var(--mut);font-weight:600}
.emobubble .emtxt{font-size:3rem;line-height:1.1;font-weight:800}
.emobubble.msg .emtxt{font-size:1.3rem;padding-top:2px}
.emobubble.out{animation:popout .5s forwards}
@keyframes popout{from{opacity:1;transform:translateX(-50%) scale(1)}to{opacity:0;transform:translateX(-50%) translateY(-20px) scale(.9)}}
@keyframes pop{to{transform:translateX(-50%) scale(1)}}
.lang{display:inline-flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.lang button{background:none;padding:6px 9px;font-size:.78rem;font-weight:700;color:var(--mut)}
.lang button.on{background:var(--acc);color:#1b1b1b}
.homehead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lobbyfoot{display:flex;justify-content:center;margin-top:28px}
.hist{display:flex;flex-direction:column;gap:6px;max-width:520px}
.hrow{display:flex;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:.9rem}
.p0c{color:var(--p0)} .p1c{color:var(--p1)}
.toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-12px);background:#1f2a3a;color:#e6f0ff;border:1px solid #33465f;padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:30;opacity:0;transition:opacity .3s,transform .3s;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.scoreov{position:fixed;inset:0;background:rgba(8,9,13,.82);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:25;display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .35s}
.scoreov.show{opacity:1}
.sobox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px 22px 16px;width:min(100%,440px);text-align:center;display:flex;flex-direction:column;gap:12px;transform:scale(.9);transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-height:92vh;overflow:auto}
.scoreov.show .sobox{transform:scale(1)}
.scoreov.won .sobox{border-color:var(--acc);box-shadow:0 0 60px rgba(255,210,63,.25)}
.sogame{color:var(--mut);font-size:.9rem}
.sotitle{font-size:1.7rem;font-weight:800}
.sosum{color:var(--mut)} .sosum b{color:var(--tx)}
.soscore{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
.sop{display:flex;flex-direction:column;align-items:center;min-width:110px}
.son{font-weight:600;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sos{font-size:3.4rem;font-weight:800;line-height:1.05}
.sop.p0 .sos{color:var(--p0)} .sop.p1 .sos{color:var(--p1)}
.socolon{font-size:2.4rem;color:var(--mut);font-weight:800}
.solabel{font-size:.78rem;color:var(--mut);margin-top:-6px}
.sobox .hist{margin:0 auto;width:100%} .sobox .hrow{font-size:.82rem;padding:6px 10px}
.sobox .rbtns{margin-top:6px}
.sobox .linkbtn{align-self:center}
@media(max-width:560px){header{gap:8px}.sc{order:5;width:100%;justify-content:center;margin-left:0}.hright{margin-left:auto}}
.btn.danger{background:#3a1c22;border-color:#6b2a35;color:#ffb3bc}
.ghead{justify-content:space-between}
.notebar{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.92rem}
.err{color:#ff7b86;min-height:1.2em;font-size:.9rem}
.paper .err{color:var(--ink0);font-size:1.15rem}
/* Home */
.home{max-width:420px;margin:0 auto;padding:48px 20px;display:flex;flex-direction:column;gap:14px}
.logo{font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
.home label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem;color:var(--mut)}
.home input,.joinrow input{background:var(--card);border:1px solid var(--line);color:var(--tx);padding:13px 14px;border-radius:12px;font-size:1.05rem;outline:none}
.home input:focus{border-color:var(--acc)}
.btn.big{padding:15px;font-size:1.05rem}
.or{text-align:center;color:var(--mut);font-size:.85rem}
.joinrow{display:flex;gap:10px}
.joinrow input{flex:1;text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:800;min-width:0}
.prev{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.prev span{background:var(--card);border:1px solid var(--line);padding:6px 10px;border-radius:20px;font-size:.8rem;color:var(--mut)}
/* Shell */
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:12px}
.logo-img{border-radius:22%;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.room{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:.8rem;color:var(--mut);cursor:pointer}
.room b{color:var(--tx);letter-spacing:.15em}
.sc{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:.95rem}
.pl{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;border:2px solid transparent;max-width:150px}
.pl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl b{font-size:1.1rem}
.pl.p0 .dot{background:var(--p0)} .pl.p1 .dot{background:var(--p1)}
.pl.on.p0{border-color:var(--p0)} .pl.on.p1{border-color:var(--p1)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
#banner:not(:empty){background:#5a2a10;color:#ffd7b0;padding:8px 14px;font-size:.9rem;text-align:center}
main{max-width:980px;margin:0 auto;padding:16px 12px 60px}
/* Lobby */
.wait{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin-bottom:20px}
.bigcode{font-size:2.6rem;font-weight:800;letter-spacing:.3em;color:var(--acc);padding-left:.3em}
.pulse{font-size:1.8rem;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}
.sect{font-size:1rem;color:var(--mut);font-weight:600;margin:6px 4px 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .1s,border-color .15s}
.tile:hover:not(:disabled){border-color:var(--acc);transform:translateY(-2px)}
.tile:disabled{opacity:.45}
.ti{font-size:1.9rem}
.tn{font-weight:700}
.td{font-size:.8rem;color:var(--mut)}
.note{color:var(--mut);font-size:.85rem;margin-top:18px;text-align:center}
.players{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
/* Game view */
.ghead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.gtitle{font-weight:800;font-size:1.15rem}
.status{min-height:28px;text-align:center;margin:6px 0 12px;font-size:1rem}
.yourturn{color:var(--acc);font-weight:700}
.board{display:flex;flex-direction:column;align-items:center}
.result{margin:18px auto 0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 20px;text-align:center;max-width:420px}
.rt{font-size:1.35rem;font-weight:800;margin-bottom:12px}
.rbtns{display:flex;gap:10px;justify-content:center}
.rules{max-width:560px;margin:24px auto 0;color:var(--mut);font-size:.9rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.rules summary{cursor:pointer;font-weight:600;color:var(--tx)}
.rules div{margin-top:8px;line-height:1.5}
.mk-s{font-size:1.6rem;font-weight:700;line-height:1;vertical-align:middle}
/* Paper */
.paper{background-color:#fbfaf3;background-image:linear-gradient(#d3e1f1 1px,transparent 1px),linear-gradient(90deg,#d3e1f1 1px,transparent 1px);background-size:22px 22px;color:#24399a;border-radius:4px;box-shadow:0 12px 30px rgba(0,0,0,.45);font-family:Caveat,cursive;position:relative}
.paper.margin{background-image:linear-gradient(90deg,transparent 44px,#ef9aa1 44px,#ef9aa1 46px,transparent 46px),linear-gradient(#d3e1f1 1px,transparent 1px),linear-gradient(90deg,#d3e1f1 1px,transparent 1px);background-size:100% 100%,22px 22px,22px 22px}
.paper .mut,.paper .mut2{color:#6b7591}
.mut2{font-size:1.1rem}
.good{color:#1d8a4a;font-weight:700} .bad{color:var(--ink0)}
/* TTT */
.ttt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));width:min(86vw,340px);aspect-ratio:1;padding:18px}
.ttt .cell{background:transparent;border:0;padding:0;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;overflow:hidden}
.ttt .cell:nth-child(3n+1),.ttt .cell:nth-child(3n+2){border-right:3px solid #2c3d7c}
.ttt .cell:nth-child(-n+6){border-bottom:3px solid #2c3d7c}
.ttt .mk{font-size:min(22vw,92px);font-weight:700;line-height:.8;display:block}
.cell.win,.sb.win{background:rgba(255,210,63,.45)}
.ttt .cell:not(:disabled):hover{background:rgba(255,210,63,.18)}
/* UTTT */
.uttt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:7px;padding:10px;width:min(94vw,450px);aspect-ratio:1}
.sb{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));min-width:0;min-height:0;border:2px solid rgba(44,61,124,.35);border-radius:5px}
.sb.act{background:rgba(255,210,63,.3);border-color:#d49b00}
.sb .cell{min-width:0;min-height:0;overflow:hidden;border:1px solid #a9bbdb;background:transparent;font-family:Caveat;font-size:clamp(17px,5.5vw,28px);font-weight:700;padding:0;line-height:1}
.sb .cell:not(:disabled):hover{background:rgba(255,210,63,.35)}
.sb.done .cell{opacity:.22}

const ROOM_MAX_AGE = 24 * 60 * 60 * 1000; // Räume ohne Aktivität werden nach 24 h gelöscht
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('timeout')), ms))]);

let fbP = null;
function loadFirebase() {
  if (fbP) return fbP;
  fbP = (async () => {
    const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
    const [appM, authM, dbM] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-database.js')]);
    const app = appM.initializeApp(FB_CONFIG);
    const auth = authM.getAuth(app);
    if (!auth.currentUser) await authM.signInAnonymously(auth);
    return { db: dbM.getDatabase(app), d: dbM, uid: auth.currentUser.uid };
  })();
  fbP.catch(() => { fbP = null; });
  return fbP;
}
async function cleanupOldRooms(fb) {
  const { db, d } = fb;
  const q = d.query(d.ref(db, 'rooms'), d.orderByChild('meta/t'), d.endAt(Date.now() - ROOM_MAX_AGE), d.limitToFirst(20));
  const snap = await d.get(q);
  snap.forEach(ch => { d.remove(ch.ref).catch(() => {}); });
}
async function makeFirebaseTransport(code, asHost) {
  const fb = await withTimeout(loadFirebase(), 12000);
  const { db, d, uid } = fb;
  const R = d.ref(db, 'rooms/' + code), unsubs = [];
  let online = true;
  const meta = await withTimeout(d.get(d.child(R, 'meta')), 10000);
  if (asHost) {
    if (meta.exists() && meta.val().host !== uid) throw new Error('taken');
    await d.set(d.child(R, 'meta'), { host: uid, t: d.serverTimestamp() });
    cleanupOldRooms(fb).catch(() => {});
  } else if (!meta.exists()) throw new Error('notfound');
  unsubs.push(d.onValue(d.ref(db, '.info/connected'), s => { online = !!s.val(); }));
  return {
    kind: 'firebase', reliable: true,
    online: () => online,
    sendState(str) { d.set(d.child(R, 'state'), { d: str }).catch(() => {}); },
    onState(fn) { unsubs.push(d.onValue(d.child(R, 'state'), s => { const v = s.val(); fn(v && typeof v.d === 'string' ? v.d : null); })); },
    sendAct(o) { d.push(d.child(R, 'acts'), { d: JSON.stringify(o) }).catch(() => {}); },
    onAct(fn) {
      unsubs.push(d.onChildAdded(d.child(R, 'acts'), s => {
        const v = s.val(); d.remove(s.ref).catch(() => {});
        try { fn(JSON.parse(v.d)); } catch (e) {}
      }));
    },
    onPeers() {},
    heartbeat() { if (asHost) d.update(d.child(R, 'meta'), { t: d.serverTimestamp() }).catch(() => {}); },
    destroy() { return d.remove(R).catch(() => {}); },
    close() { unsubs.forEach(u => { try { u(); } catch (e) {} }); }
  };
}

// Claude-Räume und Testmodus können nur kleine Nachrichten schicken -> Zustand in Stücken senden
function chunked(raw) {
  const chunks = {};
  return {
    kind: raw.kind, reliable: false, online: () => true,
    sendState(str) { const k = rid(5), size = 1000, n = Math.max(1, Math.ceil(str.length / size)); for (let i = 0; i < n; i++) raw.send('st', { k, i, n, d: str.slice(i * size, (i + 1) * size) }); },
    onState(fn) {
      raw.on('st', m => {
        if (!m || typeof m.d !== 'string' || typeof m.k !== 'string') return;
        const now = Date.now();
        for (const k in chunks) if (now - chunks[k].t > 10000) delete chunks[k];
        const c = chunks[m.k] || (chunks[m.k] = { n: m.n, parts: [], got: 0, t: now });
        if (c.parts[m.i] == null) { c.parts[m.i] = m.d; c.got++; }
        if (c.got === c.n) { delete chunks[m.k]; fn(c.parts.join('')); }
      });
    },
    sendAct(o) { raw.send('ac', o); },
    onAct(fn) { raw.on('ac', fn); },
    onPeers: raw.onPeers, heartbeat() {}, destroy() {}, close: raw.close
  };
}
async function makeRoomRaw(api, code) {
  const r = await api.join('ms-' + code), unsubs = [];
  return {
    kind: 'room',
    send(topic, data) { r.emit(topic, data).catch(() => {}); },
    on(topic, fn) { unsubs.push(r.on(topic, m => fn(m.data))); },
    onPeers(fn) { unsubs.push(r.onPeers(ch => fn(ch))); },
    close() { unsubs.forEach(u => { try { u(); } catch (e) {} }); r.leave().catch(() => {}); }
  };
}
function makeLocalRaw(code) {
  const ch = new BroadcastChannel('minispiele-' + code), hs = {};
  ch.onmessage = e => { const d = e.data || {}; (hs[d.topic] || []).forEach(f => f(d.data)); };
  return {
    kind: 'local',
    send(t, d) { ch.postMessage({ topic: t, data: d }); },
    on(t, f) { (hs[t] = hs[t] || []).push(f); },
    onPeers() {},
    close() { ch.close(); }
  };
}

function sendState() { if (net && isHost && S) net.sendState(JSON.stringify(S)); }
function onStateStr(str) {
  if (isHost) return;
  if (str == null) { // Raum wurde gelöscht
    if (S) { leaveRoom(); homeMsg(tr('Der Raum wurde geschlossen.', 'The room was closed.')); }
    return;
  }
  let st; try { st = JSON.parse(str); } catch (e) { return; }
  if (!st || !st.hs) return;
  lastStateAt = Date.now();
  if (st.closed) { // jemand hat den Raum geschlossen
    const who = st.closed.by === ME.id ? null : ((st.players || []).find(p => p.id === st.closed.by) || {}).name;
    leaveRoom();
    homeMsg(st.closed.by === ME.id ? tr('Du hast den Raum geschlossen.', 'You closed the room.') : who ? tr(`${who} hat den Raum geschlossen.`, `${who} closed the room.`) : tr('Der Raum wurde geschlossen.', 'The room was closed.'));
    return;
  }
  if (S && S.hs === st.hs && st.v <= S.v) return;
  S = st; render();

const pidx = id => S ? S.players.findIndex(p => p.id === id) : -1;

/* ---------- Der Host verarbeitet alle Aktionen ---------- */
function handleAction(a, from) {
  if (!S || !a || typeof a.t !== 'string') return;
  const p = pidx(from);
  switch (a.t) {
    case 'hello': {
      const name = String(a.name || '').slice(0, 16) || 'Player';
      const pl = S.players.find(x => x.id === from);
      if (pl) { if (pl.name === name) { sendState(); return; } pl.name = name; }
      else if (S.players.length < 2) { S.players.push({ id: from, name }); S.scores[from] = 0; }
      else if (!S.spec.find(x => x.id === from)) S.spec.push({ id: from, name });
      else { sendState(); return; }
      commit(); return;
    }
    case 'pick':
      if (p < 0 || S.players.length < 2 || !GAMES[a.game]) return;
      S.note = null;
      startGame(a.game, a.opts || {}); commit(); return;
    case 'again':
      if (p < 0 || !S.game || !S.g.over) return;
      startGame(S.game, S.opts || {}); commit(); return;
    case 'emo': {
      if (p < 0 || !emoText(a.k)) return;
      const now = Date.now();
      S.emoT = S.emoT || {};
      if (now - (S.emoT[from] || 0) < 1000) return;
      S.emoT[from] = now;
      S.emo = { by: from, k: a.k, id: rid(5) };
      commit(); return;
    }
    case 'close': {
      if (p < 0 || S.closed) return;
      S.closed = { by: from };

    const i = a.i | 0, kind = a.kind || 'shot';
    if (i < 0 || i > 99 || !WEAPONS.find(w => w.k === kind)) return false;
    if (kind !== 'shot') { if (!g.weapons || !g.wpn[p][kind]) return false; }
    const opp = 1 - p, sh = g.shots[p].split(''), m = fleetMap(g.keys, g.fleets[opp]);
    const r = (i / 10) | 0, cc = i % 10;
    if (kind === 'radar') {
      let n = 0; const cells = [];
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { const R = r + dr, C = cc + dc; if (R >= 0 && R < 10 && C >= 0 && C < 10) { const x = R * 10 + C; cells.push(x); if (m[x] >= 0 && sh[x] !== '1') n++; } }
      g.wpn[p].radar = 0; g.radar[p].push({ i, n });

      cells = [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]].map(([dr, dc]) => [r + dr, cc + dc]).filter(([R, C]) => R >= 0 && R < 10 && C >= 0 && C < 10).map(([R, C]) => R * 10 + C).filter(x => sh[x] === '0');

      for (let C = 0; C < 10; C++) { const x = r * 10 + C; if (sh[x] === '1' && m[x] >= 0) continue; if (sh[x] !== '1') cells.push(x); if (m[x] >= 0) break; }
      if (!cells.length) return false;
    }
    if (kind !== 'shot') g.wpn[p][kind] = 0;
    const before = sunkList(g.keys, g.fleets[opp], sh.join(''));
    cells.forEach(x => sh[x] = '1');
    const hit = cells.some(x => m[x] >= 0);
    const after = sunkList(g.keys, g.fleets[opp], sh.join(''));
    let sunk = false;
    after.forEach((s, k) => { if (s && !before[k]) { sunk = true; placeCells(g.keys[k], g.fleets[opp][k]).forEach(x => nb8(x).forEach(n => { if (sh[n] === '0') sh[n] = '2'; })); } });
    g.shots[p] = sh.join('');
    g.last = { p, kind, cells, hit, sunk };
    if (after.every(Boolean)) { g.over = true; g.winner = p; return; }
    if (!hit) g.turn = opp;
  },
  render(el, c) {

  renderShoot(el, c, g, me, opp, nm, keys) {

      <div class="whint">${myTurn ? esc(L(WEAPONS.find(w => w.k === bsL.mode).hint)) : ''}</div>` : '';

/* ---------- Code knacken (Mastermind) ---------- */
const MMC = ['#e3283a', '#2f8cff', '#2fcf6f', '#ffd21f', '#ff8a1a', '#a855f7'];
let mmL = { key: null, cur: [null, null, null, null] };
const mmFin = (g, p) => g.solved[p] > 0 || g.guesses[p].length >= g.max;
function mmFeedback(code, guess) {
  let b = 0; const cc = Array(6).fill(0), gc = Array(6).fill(0);
  for (let i = 0; i < 4; i++) { if (code[i] === guess[i]) b++; cc[code[i]]++; gc[guess[i]]++; }
  let t = 0; for (let k = 0; k < 6; k++) t += Math.min(cc[k], gc[k]);
  return { b, w: t - b };
}
const validCode = c => Array.isArray(c) && c.length === 4 && c.every(x => Number.isInteger(x) && x >= 0 && x < 6);
GAMES.mm = {
  name: { de: "Code knacken", en: "Code Breaker" }, icon: '🔐', desc: { de: "Mastermind \u2013 Farbcode erraten", en: "Mastermind \u2013 crack the color code" },

  try { navigator.clipboard.writeText(S.code.toUpperCase()).then(() => toast(tr('Code kopiert!', 'Code copied!')), () => {}); } catch (e) {}
}
function confirmBox(title, text, okLabel, fn) {
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="mbox" style="max-width:380px"><h3>${esc(title)}</h3><p class="mut" style="line-height:1.5;margin:0">${esc(text)}</p><div class="mbtns"><button class="btn" data-x>${tr('Abbrechen', 'Cancel')}</button><button class="btn danger" data-ok>${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(m);
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-ok]', m).onclick = () => { m.remove(); fn(); };
  m.onclick = e => { if (e.target === m) m.remove(); };
}
function askCloseRoom() {
  confirmBox(tr('Raum schließen?', 'Close the room?'),
    tr('Der Raum wird für beide Spieler geschlossen und ihr kehrt zum Startbildschirm zurück. Dort könnt ihr jederzeit einen neuen Raum erstellen.',
       'The room will be closed for both players and you return to the start screen. You can create a new room there at any time.'),
    tr('Raum schließen', 'Close room'),
    () => { if (myIdx() >= 0) dispatch({ t: 'close' }); else leaveRoom(); });
}
function inviteLink() { return location.origin + location.pathname + '#' + S.code.toUpperCase(); }
function shareInvite() {
  if (!S) return;
  const url = inviteLink(), text = tr(`Spiel mit mir Minispiele! Raum-Code: ${S.code.toUpperCase()}`, `Play Minispiele with me! Room code: ${S.code.toUpperCase()}`);
  if (navigator.share) { navigator.share({ title: 'Minispiele', text, url }).catch(() => {}); return; }
  try { navigator.clipboard.writeText(url).then(() => toast(tr('Einladungslink kopiert!', 'Invite link copied!')), () => {}); } catch (e) {}
}

/* ---------- Bildschirme ---------- */
function render() {
  const app = $('#app');
  if (!net) { removeOverlay(); setTurnGlow(-1); lastEmoId = undefined; const ep = $('#emopanel'); if (ep) ep.remove(); renderHome(app); return; }
  if (!S) { renderWaiting(app); return; }
  if (app.dataset.view !== 'shell') {
    app.dataset.view = 'shell';
    app.innerHTML = `<header><div class="brand">${logoImg(30)} Minispiele</div><div class="room" id="roomchip" title="${tr('Code kopieren', 'Copy code')}"></div><div class="sc" id="score"></div><div class="hright">${langSwitch()}<button class="btn sm danger" id="leave">${tr('Raum schließen', 'Close room')}</button></div></header><div id="banner"></div><main id="main"></main><button class="emobtn" id="emobtn" title="Emotes">😀</button>`;
    $('#leave').onclick = askCloseRoom;
    $('#emobtn').onclick = emoPanel;
    $('#roomchip').onclick = () => copyCode();
  }
  renderHeader();
  checkEmote();
  const main = $('#main');
  if (!S.game) {
    removeOverlay(); setTurnGlow(-1);
    if (main.dataset.view !== 'lobby') main.dataset.view = 'lobby';
    renderLobby(main);
  } else {
    const k = 'game:' + S.g.gid;
    if (main.dataset.view !== k) { main.dataset.view = k; main.innerHTML = ''; }
    renderGame(main);
  }
}
function renderHome(app) {
  if (app.dataset.view === 'home') return;
  app.dataset.view = 'home';
  app.innerHTML = `<div class="home">
    <div class="homehead"><div class="logo">${logoImg(46)} Minispiele</div>${langSwitch()}</div>
    <div class="mut">${tr('Klassische Spiele für zwei – jeder auf seinem eigenen Gerät.', 'Classic games for two – each on their own device.')}</div>
    <label>${tr('Dein Name', 'Your name')}<input id="nm" maxlength="16" placeholder="${tr('z. B. Oktopusfänger123', 'e.g. OctopusCatcher123')}" value="${esc(ME.name)}"></label>
    <button class="btn pri big" id="create">${tr('Raum erstellen', 'Create room')}</button>
    <div class="or">— ${tr('oder', 'or')} —</div>
    <div class="joinrow"><input id="code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button class="btn" id="join">${tr('Beitreten', 'Join')}</button></div>
    <div id="hmsg" class="err">${esc(homeMsgText)}</div>
    <div class="prev">${ORDER.map(id => `<span>${GAMES[id].icon} ${L(GAMES[id].name)}</span>`).join('')}</div></div>`;
  const nm = $('#nm');
  const saveName = () => { ME.name = nm.value.trim().slice(0, 16); store.set('name', ME.name); return ME.name; };
  nm.oninput = saveName;
  const needName = () => { homeMsg(tr('Bitte gib zuerst deinen Namen ein.', 'Please enter your name first.')); nm.focus(); };
  $('#create').onclick = () => { if (!saveName()) return needName(); connect(newCode(), true); };
  const join = () => {
    if (!saveName()) return needName();
    const code = $('#code').value.trim().toLowerCase();
    if (!/^[a-z0-9]{4}$/.test(code)) { homeMsg(tr('Der Code hat 4 Zeichen.', 'The code has 4 characters.')); return; }
    connect(code, false);
  };
  $('#join').onclick = join;
  $('#code').onkeydown = e => { if (e.key === 'Enter') join(); };
}
function renderWaiting(app) {
  if (app.dataset.view === 'wait') return;
  app.dataset.view = 'wait';
  const code = (sess.get('room') || {}).code || '';
  app.innerHTML = `<div class="home"><div class="logo">${logoImg(46)} Minispiele</div><div class="wait"><div class="pulse">📡</div><b>${tr('Verbinde mit Raum', 'Connecting to room')} ${esc(code.toUpperCase())} …</b><div class="mut sm" id="wmsg"></div><button class="btn sm" id="cancel">${tr('Abbrechen', 'Cancel')}</button></div></div>`;
  $('#cancel').onclick = leaveRoom;
}
function renderHeader() {
  const g = S.g, G = S.game && GAMES[S.game];
  const turnP = G && G.turn && g && !g.over ? g.turn : -1;
  $('#roomchip').innerHTML = `${tr('Raum', 'Room')} <b>${S.code.toUpperCase()}</b> ⧉`;
  $('#score').innerHTML = S.players.map((p, i) => `<span class="pl p${i} ${turnP === i ? 'on' : ''}"><span class="dot"></span><span class="nm">${esc(p.name)}${p.id === ME.id ? tr(' (du)', ' (you)') : ''}</span><b>${S.scores[p.id] || 0}</b></span>`).join('<span class="mut">:</span>')
    + (S.spec.length ? `<span class="mut sm">👀 ${S.spec.length}</span>` : '');
}
let lastNoteT = 0;
function renderLobby(main) {
  const two = S.players.length >= 2, me = myIdx();
  main.innerHTML = `${!two ? `<div class="wait"><div class="pulse">⏳</div><div><b>${tr('Warte auf deinen Mitspieler …', 'Waiting for your opponent …')}</b><br><span class="mut">${tr('Schick ihm diesen Raum-Code:', 'Send them this room code:')}</span></div><div class="bigcode">${S.code.toUpperCase()}</div><div class="rbtns">${net.kind === 'firebase' ? `<button class="btn sm pri" id="share">${tr('Einladungslink teilen', 'Share invite link')}</button>` : ''}<button class="btn sm" id="cp2">${tr('Code kopieren', 'Copy code')}</button></div></div>` : ''}
    ${me < 0 ? `<p class="note">${tr('Der Raum ist voll – du schaust zu.', 'The room is full – you are watching.')}</p>` : ''}
    <h2 class="sect">${two ? tr('Spiel auswählen', 'Choose a game') : tr('Diese Spiele warten auf euch', 'These games are waiting for you')}</h2>
    <div class="tiles">${ORDER.map(id => { const G = GAMES[id]; return `<button class="tile" data-g="${id}" ${!two || me < 0 ? 'disabled' : ''}><div class="ti">${G.icon}</div><div class="tn">${L(G.name)}</div><div class="td">${L(G.desc)}</div></button>`; }).join('')}</div>
    ${S.hist && S.hist.length ? `<h2 class="sect">${tr('Bisher gespielt', 'Played so far')}</h2><div class="hist">${histHtml(6)}</div>` : ''}
    <div class="lobbyfoot">${me >= 0 ? `<button class="btn danger" id="closeroom">${tr('🚪 Raum schließen', '🚪 Close room')}</button>` : ''}</div>
    ${net.kind === 'local' ? `<p class="note">${tr('⚠️ Testmodus: Online-Räume sind hier nicht verfügbar. Verbindung klappt nur zwischen Tabs in diesem Browser.', '⚠️ Test mode: online rooms are not available here. Only tabs in this browser can connect.')}</p>` : ''}`;
  const cp = $('#cp2'); if (cp) cp.onclick = copyCode;
  const sh = $('#share'); if (sh) sh.onclick = shareInvite;
  const cr = $('#closeroom'); if (cr) cr.onclick = askCloseRoom;
  main.querySelectorAll('.tile').forEach(t => t.onclick = () => openOpts(t.dataset.g));
  if (S.note && S.note.t !== lastNoteT && GAMES[S.note.game]) {
    lastNoteT = S.note.t;
    const gn = L(GAMES[S.note.game].name);
    toast(S.note.by === ME.id ? tr(`Du hast „${gn}“ beendet.`, `You ended “${gn}”.`) : tr(`${(S.players.find(p => p.id === S.note.by) || {}).name || 'Dein Mitspieler'} hat „${gn}“ beendet.`, `${(S.players.find(p => p.id === S.note.by) || {}).name || 'Your opponent'} ended “${gn}”.`));
  }
}
function histHtml(n) {
  return (S.hist || []).slice(-n).reverse().map(h => {
    const G = GAMES[h.g]; if (!G) return '';
    const w = h.w >= 0 && h.n ? h.n[h.w] : null;
    return `<div class="hrow"><span>${G.icon} ${L(G.name)}</span><span class="${h.w >= 0 ? 'p' + h.w + 'c' : 'mut'}">${w ? '🏆 ' + esc(w) : tr('🤝 Unentschieden', '🤝 Draw')}</span></div>`;
  }).join('');
}
function resultTitle(g, c) {
  if (g.draw) return tr('🤝 Unentschieden!', '🤝 It’s a draw!');
  if (g.winner === c.me) return tr('🎉 Du hast gewonnen!', '🎉 You won!');
  return tr(`🏆 ${esc(c.names[g.winner])} gewinnt!`, `🏆 ${esc(c.names[g.winner])} wins!`);
}
function renderGame(main) {
  const G = GAMES[S.game], g = S.g, c = mkCtx();
  if (!main.firstChild) {
    main.innerHTML = `<div class="ghead"><div class="gtitle">${G.icon} ${L(G.name)}</div><button class="btn sm danger" id="back"></button></div>
      <div class="status" id="status"></div><div class="board" id="board"></div><div id="resbar"></div>
      <details class="rules"><summary>${tr('Spielregeln', 'Rules')}</summary><div>${L(G.rules)}</div></details>`;
  }
  const back = $('#back');
  back.style.display = c.me < 0 ? 'none' : '';
  if (g.over) { back.textContent = tr('← Zur Spielauswahl', '← Back to games'); back.classList.remove('danger'); back.onclick = () => dispatch({ t: 'menu' }); }
  else {
    back.textContent = tr('✕ Spiel beenden', '✕ End game'); back.classList.add('danger');
    back.onclick = () => confirmBox(tr('Spiel beenden?', 'End this game?'),
      tr(`Ihr kehrt beide zur Spielauswahl zurück. Das laufende Spiel „${L(G.name)}“ wird nicht gewertet, der Punktestand bleibt erhalten.`, `You both return to the game selection. The current game “${L(G.name)}” won’t count; the score is kept.`),
      tr('Spiel beenden', 'End game'), () => dispatch({ t: 'menu' }));
  }
  const ae = document.activeElement, fid = ae && ae.id && main.contains(ae) ? ae.id : null;
  let sel = null; try { sel = fid ? ae.selectionStart : null; } catch (e) {}
  const tp = g.over ? null : G.turnOf ? G.turnOf(g) : G.turn ? g.turn : null;   // wer ist dran (bei Spielen mit Zügen)
  const mine = tp != null && tp === c.me;
  let st = '';
  if (tp != null) st = mine
    ? `<div class="turnbar mine p${c.me}">🎯 ${tr('DU BIST DRAN!', 'YOUR TURN!')} ${G.piece ? G.piece(g, c.me) : ''}</div>`
    : `<div class="turnbar">⏳ ${tr(`${esc(c.names[tp])} ist dran …`, `${esc(c.names[tp])}’s turn …`)} ${G.piece ? G.piece(g, tp) : ''}</div>`;
  const extra = g.over ? '' : G.status ? G.status(g, c) : '';
  if (extra) st += `<div class="substatus">${extra}</div>`;
  $('#status').innerHTML = st;
  setTurnGlow(mine ? c.me : -1);
  G.render($('#board'), c);
  const rb = $('#resbar');
  if (g.over) {
    rb.innerHTML = `<div class="result"><div class="rt">${resultTitle(g, c)}</div>${c.me >= 0 ? `<div class="rbtns"><button class="btn pri" id="again">${tr('🔁 Nochmal', '🔁 Play again')}</button><button class="btn" id="tomenu">${tr('🎲 Nächstes Spiel', '🎲 Next game')}</button></div>` : ''}</div>`;
    const a = $('#again'); if (a) a.onclick = () => dispatch({ t: 'again' });
    const m = $('#tomenu'); if (m) m.onclick = () => dispatch({ t: 'menu' });
    showOverlay(g, c, G);
  } else { rb.innerHTML = ''; removeOverlay(); }
  if (fid) {
    const n = document.getElementById(fid);
    if (n && n !== document.activeElement && !n.disabled) { n.focus(); try { if (sel != null) n.setSelectionRange(sel, sel); } catch (e) {} }
  }
}

/* ---------- Scoreboard nach jedem Spiel ---------- */
let ovGid = null;
function removeOverlay() { const o = $('#scoreov'); if (o) o.remove(); }
function setTurnGlow(p) {
  document.body.classList.toggle('myturn', p >= 0);
  document.body.classList.toggle('glow0', p === 0);
  document.body.classList.toggle('glow1', p === 1);
}

/* ---------- Emotes & Schnellnachrichten ---------- */
const EMOTES = ['👍', '👎', '😂', '😮', '😡', '🖕', '🔥', 'GG'];
const QUICK = [
  { de: 'Glück gehabt! 🍀', en: 'Lucky! 🍀' }, { de: 'Gut gespielt! 🤝', en: 'Well played! 🤝' },
  { de: 'Revanche? 🔁', en: 'Rematch? 🔁' }, { de: 'Beeil dich! ⏰', en: 'Hurry up! ⏰' },
  { de: 'Oh nein! 😱', en: 'Oh no! 😱' }, { de: 'Nicht schlecht! 👏', en: 'Not bad! 👏' }
];
let lastEmoId = undefined, emoCool = 0;
function emoText(k) {
  if (typeof k !== 'string') return '';
  const i = parseInt(k.slice(1), 10);
  if (k[0] === 'e' && EMOTES[i]) return EMOTES[i];
  if (k[0] === 'q' && QUICK[i]) return L(QUICK[i]);
  return '';
}
function emoPanel() {
  let pn = $('#emopanel');
  if (pn) { pn.remove(); return; }
  pn = document.createElement('div');
  pn.id = 'emopanel'; pn.className = 'emopanel';
  pn.innerHTML = `<div class="emogrid">${EMOTES.map((e, i) => `<button data-k="e${i}">${e}</button>`).join('')}</div>
    <div class="quick">${QUICK.map((q, i) => `<button data-k="q${i}">${esc(L(q))}</button>`).join('')}</div>`;
  document.body.appendChild(pn);
  pn.onclick = e => {
    const b = e.target.closest('[data-k]'); if (!b) return;
    if (Date.now() - emoCool < 1500) return;
    emoCool = Date.now();
    dispatch({ t: 'emo', k: b.dataset.k });
    pn.remove();
  };
}
function checkEmote() {
  if (!S) return;
  const em = S.emo;
  if (lastEmoId === undefined) { lastEmoId = em ? em.id : null; return; }   // beim Beitreten alte Emotes nicht zeigen
  if (!em || em.id === lastEmoId) return;
  lastEmoId = em.id;
  const txt = emoText(em.k); if (!txt) return;
  const pi = S.players.findIndex(p => p.id === em.by);
  const who = em.by === ME.id ? tr('Du', 'You') : (S.players[pi] || {}).name || '?';
  const b = document.createElement('div');
  b.className = `emobubble ${em.k[0] === 'q' ? 'msg' : ''} p${pi}`;
  b.innerHTML = `<span class="emwho">${esc(who)}</span><span class="emtxt">${esc(txt)}</span>`;
  document.querySelectorAll('.emobubble').forEach(x => x.remove());
  document.body.appendChild(b);
  setTimeout(() => b.classList.add('out'), 2600);
  setTimeout(() => b.remove(), 3200);
}
function showOverlay(g, c, G) {
  if (ovGid === g.gid) return;            // pro Spiel nur einmal automatisch zeigen
  ovGid = g.gid;
  removeOverlay();
  const sum = G.summary ? G.summary(g, c) : '';
  const cls = g.draw ? 'draw' : g.winner === c.me ? 'won' : 'lost';
  const o = document.createElement('div');
  o.id = 'scoreov'; o.className = 'scoreov ' + cls;
  o.innerHTML = `<div class="sobox">
    <div class="sogame">${G.icon} ${L(G.name)}</div>
    <div class="sotitle">${resultTitle(g, c)}</div>
    ${sum ? `<div class="sosum">${sum}</div>` : ''}
    <div class="soscore">${S.players.map((p, i) => `<div class="sop p${i}"><div class="son">${esc(p.name)}${p.id === ME.id ? tr(' (du)', ' (you)') : ''}</div><div class="sos">${S.scores[p.id] || 0}</div></div>`).join('<div class="socolon">:</div>')}</div>
    <div class="solabel">${tr('Gesamtstand in diesem Raum', 'Overall score in this room')}</div>
    ${S.hist && S.hist.length > 1 ? `<div class="hist">${histHtml(5)}</div>` : ''}
    ${c.me >= 0 ? `<div class="rbtns"><button class="btn pri" data-a="again">${tr('🔁 Nochmal', '🔁 Play again')}</button><button class="btn" data-a="menu">${tr('🎲 Nächstes Spiel', '🎲 Next game')}</button></div>` : ''}
    <button class="linkbtn" data-a="view">${tr('Spielfeld ansehen', 'View the board')}</button></div>`;
  document.body.appendChild(o);
  requestAnimationFrame(() => o.classList.add('show'));
  o.onclick = e => {
    const b = e.target.closest('[data-a]');
    if (!b) return;
    if (b.dataset.a === 'again') dispatch({ t: 'again' });
    if (b.dataset.a === 'menu') dispatch({ t: 'menu' });
    removeOverlay();
  };
}
function openOpts(id) {
  const G = GAMES[id];
  if (!G.opts) { dispatch({ t: 'pick', game: id, opts: {} }); return; }
  const st = G.opts.load();
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = `<div class="mbox"><h3>${G.icon} ${L(G.name)}</h3><div class="mbody"></div><div class="mbtns"><button class="btn" data-x>${tr('Abbrechen', 'Cancel')}</button><button class="btn pri" data-go>${tr("Los geht's!", "Let's go!")}</button></div></div>`;
  document.body.appendChild(m);
  const body = $('.mbody', m), draw = () => G.opts.render(body, st, draw);
  draw();
  $('[data-x]', m).onclick = () => m.remove();
  $('[data-go]', m).onclick = () => { G.opts.save(st); m.remove(); dispatch({ t: 'pick', game: id, opts: G.opts.out(st) }); };
  m.onclick = e => { if (e.target === m) m.remove(); };
}

/* =========================================================
   Taktgeber
   ========================================================= */
setInterval(() => {
  if (!net) return;
  const now = Date.now();
  if (isHost) {
    if (S && S.game && !S.g.over) { const G = GAMES[S.game]; if (G.hostTick && G.hostTick(S.g)) { afterMove(); commit(); } }
  } else {
    const helloGap = net.reliable ? 3000 : 1500;
    if (now - lastHello > helloGap && (!S || !inRoom() || (S.players.find(p => p.id === ME.id) || {}).name !== (ME.name || 'Player'))) {
      if (!S || !inRoom() || S.players.some(p => p.id === ME.id)) { lastHello = now; net.sendAct({ f: ME.id, a: { t: 'hello', name: ME.name || 'Player' } }); }
    }
    if (!S) { const w = $('#wmsg'); if (w && now - joinAt > 8000) w.textContent = tr('Noch keine Antwort. Stimmt der Code? Ist der Raum-Ersteller online?', 'No answer yet. Is the code right? Is the room creator online?'); }
  }
  const b = $('#banner');
  if (b && S) {
    let txt = '';
    if (!net.online()) txt = tr('Keine Internetverbindung – warte …', 'No internet connection – waiting …');
    else if (!isHost && !net.reliable && now - lastStateAt > 10000) txt = tr('Verbindung zum Raum-Ersteller unterbrochen – warte …', 'Lost connection to the room creator – waiting …');
    if (b.textContent !== txt) b.textContent = txt;
  }
  if (S && S.game && S.g && GAMES[S.game].tick) GAMES[S.game].tick(S.g, mkCtx());
}, 300);
setInterval(() => {
  if (!isHost || !S || !net) return;
  if (!net.reliable) sendState();                                   // Claude-Räume: regelmäßig neu senden
  else if (Date.now() - lastBeat > 60000) { lastBeat = Date.now(); net.heartbeat(); } // Firebase: Raum als aktiv markieren
}, 3000);

/* Start: nach einem Neuladen automatisch zurück in den Raum */
(function boot() {
  const r = sess.get('room');
  if (r && r.code) connect(r.code, !!r.host, r.host ? sess.get('hostS') : null);
  else {
    render();
    const h = (location.hash || '').slice(1).toLowerCase();
    const ci = $('#code');
    if (ci && /^[a-z0-9]{4}$/.test(h)) { ci.value = h.toUpperCase(); homeMsg(tr('Gib deinen Namen ein und tippe auf „Beitreten“.', 'Enter your name and tap “Join”.')); }
  }
})();
</script>
